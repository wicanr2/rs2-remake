[workspace]
resolver = "3"
members = ["crates/rs2-formats", "crates/rs2-core", "crates/rs2-gfx", "crates/rs2-trace"]
exclude = ["crates/rs2-play"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-RRSAL-1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
